<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    .bg {
      width: 1200px;
      height: 630px;
      background: #320D10;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .beams {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          -35deg,
          transparent 15%,
          hsla(345, 60%, 38%, 0.22) 30%,
          hsla(345, 60%, 38%, 0.26) 38%,
          transparent 52%
        ),
        linear-gradient(
          -35deg,
          transparent 42%,
          hsla(355, 58%, 36%, 0.18) 56%,
          hsla(355, 58%, 36%, 0.22) 63%,
          transparent 75%
        ),
        linear-gradient(
          -35deg,
          transparent 68%,
          hsla(340, 62%, 34%, 0.14) 78%,
          hsla(340, 62%, 34%, 0.18) 84%,
          transparent 94%
        );
      filter: blur(12px);
    }
    .logo-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    /* Both divs use the same logo PNG at the same scale (auto 220px height)
       Scale factor: 220/795 = 0.2767
       Full image displayed width: 2140 * 0.2767 = 592px
       Coordinates are in original-image pixels, converted by scale */
    .m-mark {
      /* M icon: approx x:30–530, y:60–730 in original
         displayed: x:8–147px, height crop to ~165px */
      width: 148px;
      height: 158px;
      background: url('brand_assets/mco-logo-transparent.png') no-repeat;
      background-size: auto 220px;
      background-position: -8px -17px;
      flex-shrink: 0;
    }
    .cream-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: #F5EFE6;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }
    .cream-bar span {
      font-family: 'Quicksand', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #320D10;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="bg">
    <div class="beams"></div>
    <div class="logo-wrap">
      <div class="m-mark"></div>
    </div>
    <div class="cream-bar">
      <span>VC & PE Advisory at Critical Inflection Points</span>
    </div>
  </div>
</body>
</html>
