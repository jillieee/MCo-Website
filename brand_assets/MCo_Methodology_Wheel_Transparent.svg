<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 57 1400 1400" width="1400" height="1400">
  <!-- ===================================================================
       The Merit Methodology — Four-quadrant wheel
       Brand palette: Oxblood / Parchment Gold / Muted / Parchment on Cream
       Center: M mark on Ink
       =================================================================== -->

  <defs>
    <marker id="arrowhead" viewBox="0 0 12 12" refX="11" refY="6"
            markerWidth="28" markerHeight="28" orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#A89060"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap');
    </style>
  </defs>

  <!-- ============ BACKGROUND ============ -->


  <!-- ============ DIAGRAM GROUP (vertically centered between header and footer) ============ -->
  <g transform="translate(0 -110)">

  <!-- ============ FOUR QUADRANTS (floating, parallel-sided gaps) ============
       Center (700, 920), outer radius 380, inner radius 130.
       Each section's side edges are PARALLEL to the diagonal (NE/SE/SW/NW),
       offset 9 units perpendicular into each quadrant. The result is a
       constant-width 18-unit gap between adjacent sections — no wedge.
  -->
  <!-- TOP — Leadership in the Age of AI (Oxblood / Dark Maroon) -->
  <path d="M 437.74,645.02 A 380,380 0 0 1 962.26,645.02 L 785.33,821.95 A 130,130 0 0 0 614.67,821.95 Z"
        fill="#320D10"/>

  <!-- RIGHT — Executive Activation (Parchment Gold) -->
  <path d="M 974.98,657.74 A 380,380 0 0 1 974.98,1182.26 L 798.05,1005.33 A 130,130 0 0 0 798.05,834.67 Z"
        fill="#A89060"/>

  <!-- BOTTOM — Operational Performance (Wine) -->
  <path d="M 962.26,1194.98 A 380,380 0 0 1 437.74,1194.98 L 614.67,1018.05 A 130,130 0 0 0 785.33,1018.05 Z"
        fill="#6A2C30"/>

  <!-- LEFT — Culture Design (Muted Charcoal) -->
  <path d="M 425.02,1182.26 A 380,380 0 0 1 425.02,657.74 L 601.95,834.67 A 130,130 0 0 0 601.95,1005.33 Z"
        fill="#7A716A"/>

  <!-- ============ QUADRANT LABELS ============ -->
  <!-- TOP — Leadership in the Age of AI  (icon: human + robot, cream line art) -->
  <g transform="translate(700 633)" fill="none" stroke="#F5EFE6"
     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Human, left -->
    <circle cx="-13" cy="-7" r="4.5"/>
    <path d="M -20,14 V 4 Q -20,-1 -13,-1 Q -6,-1 -6,4 V 14"/>
    <!-- Robot, right: antenna, square head, body -->
    <line x1="13" y1="-19" x2="13" y2="-15"/>
    <circle cx="13" cy="-20.5" r="1.3" fill="#F5EFE6"/>
    <rect x="7" y="-14" width="12" height="11" rx="2"/>
    <path d="M 6,14 V 4 Q 6,-1 13,-1 Q 20,-1 20,4 V 14"/>
  </g>
  <g text-anchor="middle">
    <text x="700" y="688" font-family="'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="28" fill="#F5EFE6">
      Leadership in the
    </text>
    <text x="700" y="724" font-family="'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="28" fill="#F5EFE6">
      Age of AI
    </text>
  </g>

  <!-- RIGHT — Executive Activation  (icon: bullseye + arrow, cream line art) -->
  <g transform="translate(950 870)" fill="none" stroke="#F5EFE6"
     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="17"/>
    <circle cx="0" cy="0" r="10"/>
    <circle cx="0" cy="0" r="3" fill="#F5EFE6"/>
    <!-- Arrow piercing from upper-right -->
    <line x1="22" y1="-22" x2="5" y2="-5"/>
    <path d="M 5,-5 L 13,-9 L 9,-13 Z" fill="#F5EFE6" stroke="none"/>
  </g>
  <g text-anchor="middle">
    <text x="950" y="925" font-family="'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="28" fill="#F5EFE6">
      Executive
    </text>
    <text x="950" y="961" font-family="'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="28" fill="#F5EFE6">
      Activation
    </text>
  </g>

  <!-- BOTTOM — Operational Performance  (icon: gear, cream line art) -->
  <g transform="translate(700 1133)" fill="none" stroke="#F5EFE6"
     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 8 tooth marks -->
    <g stroke-width="3">
      <line x1="0" y1="-18" x2="0" y2="-13"/>
      <line x1="12.73" y1="-12.73" x2="9.19" y2="-9.19"/>
      <line x1="18" y1="0" x2="13" y2="0"/>
      <line x1="12.73" y1="12.73" x2="9.19" y2="9.19"/>
      <line x1="0" y1="18" x2="0" y2="13"/>
      <line x1="-12.73" y1="12.73" x2="-9.19" y2="9.19"/>
      <line x1="-18" y1="0" x2="-13" y2="0"/>
      <line x1="-12.73" y1="-12.73" x2="-9.19" y2="-9.19"/>
    </g>
    <!-- Gear body -->
    <circle cx="0" cy="0" r="10"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="3.5"/>
  </g>
  <g text-anchor="middle">
    <text x="700" y="1188" font-family="'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="28" fill="#F5EFE6">
      Operational
    </text>
    <text x="700" y="1224" font-family="'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="28" fill="#F5EFE6">
      Performance
    </text>
  </g>

  <!-- LEFT — Culture Design  (icon: three people, cream line art) -->
  <g transform="translate(450 870)" fill="none" stroke="#F5EFE6"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left person -->
    <circle cx="-17" cy="-7" r="4"/>
    <path d="M -22,14 V 3 Q -22,-1 -17,-1 Q -12,-1 -12,3 V 14"/>
    <!-- Middle person (slightly higher) -->
    <circle cx="0" cy="-9" r="4"/>
    <path d="M -5,14 V 1 Q -5,-3 0,-3 Q 5,-3 5,1 V 14"/>
    <!-- Right person -->
    <circle cx="17" cy="-7" r="4"/>
    <path d="M 12,14 V 3 Q 12,-1 17,-1 Q 22,-1 22,3 V 14"/>
  </g>
  <g text-anchor="middle">
    <text x="450" y="925" font-family="'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="28" fill="#F5EFE6">
      Culture
    </text>
    <text x="450" y="961" font-family="'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="28" fill="#F5EFE6">
      Design
    </text>
  </g>

