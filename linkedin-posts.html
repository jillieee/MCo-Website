<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; }

  .grain-overlay {
    position: absolute; inset: 0; z-index: 1; opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px 256px; pointer-events: none;
  }

  /* =====================================================
     POST 1 — Dark, centered, brand-consistent with banner
  ===================================================== */
  .p1 {
    width: 1080px; height: 1080px;
    background: linear-gradient(145deg, #1A0507 0%, #3D0F14 45%, #2A0A0D 75%, #1A0507 100%);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Georgia', serif;
  }
  .p1-glow {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(168,144,96,0.08) 0%, transparent 68%);
    z-index: 2; pointer-events: none;
  }
  .p1-watermark {
    position: absolute; right: -120px; bottom: -80px;
    opacity: 0.055; z-index: 2; pointer-events: none;
  }
  .p1-content {
    position: relative; z-index: 5;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    width: 100%; padding: 0 100px;
  }
  .p1-intro {
    font-size: 12px; font-weight: 600; letter-spacing: 0.24em;
    text-transform: uppercase; color: #A89060;
    font-family: 'Arial', sans-serif; margin-bottom: 48px;
  }
  .p1-logo { margin-bottom: 30px; }
  .p1-name {
    font-size: 34px; font-weight: 400; letter-spacing: 0.18em;
    text-transform: uppercase; color: #F0ECE5; line-height: 1.45;
    font-family: 'Georgia', serif; margin-bottom: 44px;
  }
  .p1-rule { width: 50px; height: 1px; background: #A89060; opacity: 0.45; margin-bottom: 44px; }
  .p1-tagline {
    font-size: 30px; color: #F0ECE5; line-height: 1.4;
    font-weight: 400; letter-spacing: -0.01em;
  }
  .p1-tagline em { color: #A89060; font-style: normal; }
  .p1-url {
    position: absolute; bottom: 56px; left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: 0.1em; color: rgba(240,236,229,0.28);
    font-family: 'Arial', sans-serif; z-index: 5;
  }

  /* =====================================================
     POST 2 — Cream / editorial
  ===================================================== */
  .p2 {
    width: 1080px; height: 1080px;
    background: #F0ECE5;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    font-family: 'Georgia', serif;
  }
  .p2-top {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 80px 120px 60px; text-align: center;
    position: relative; z-index: 5;
  }
  .p2-intro {
    font-family: 'Georgia', serif; font-size: 20px; font-style: italic;
    color: #A89060; margin-bottom: 32px; letter-spacing: 0.02em;
  }
  .p2-logo { margin-bottom: 30px; }
  .p2-name {
    font-size: 46px; font-weight: 400; letter-spacing: 0.12em;
    text-transform: uppercase; color: #1F1A1D; line-height: 1.25;
    font-family: 'Georgia', serif; margin-bottom: 40px;
  }
  .p2-rule { width: 50px; height: 1px; background: rgba(31,26,29,0.2); margin-bottom: 40px; }
  .p2-tagline {
    font-size: 23px; color: rgba(31,26,29,0.6); line-height: 1.55;
    font-weight: 400; font-family: 'Georgia', serif;
  }
  .p2-tagline em { color: #A89060; font-style: normal; }
  .p2-footer {
    background: #1F1A1D; padding: 30px 60px;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 5; flex-shrink: 0;
  }
  .p2-footer-left { display: flex; align-items: center; gap: 14px; }
  .p2-footer-name {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #F0ECE5; font-family: 'Arial', sans-serif; font-weight: 400;
  }
  .p2-footer-url {
    font-size: 11px; letter-spacing: 0.08em; color: rgba(240,236,229,0.32);
    font-family: 'Arial', sans-serif;
  }

  /* =====================================================
     POST 3 — Dramatic: large M as hero
  ===================================================== */
  .p3 {
    width: 1080px; height: 1080px;
    background: linear-gradient(160deg, #0D0204 0%, #250810 55%, #160406 100%);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Georgia', serif;
  }
  .p3-m-bg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    opacity: 0.07; z-index: 2; pointer-events: none;
  }
  .p3-glow-top {
    position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(168,144,96,0.07) 0%, transparent 65%);
    z-index: 3; pointer-events: none;
  }
  .p3-glow-mid {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(74,11,25,0.5) 0%, transparent 70%);
    z-index: 3; pointer-events: none;
  }
  .p3-content {
    position: relative; z-index: 5;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 0 100px;
  }
  .p3-eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.26em;
    text-transform: uppercase; color: #A89060;
    font-family: 'Arial', sans-serif; margin-bottom: 36px;
  }
  .p3-logo { margin-bottom: 36px; }
  .p3-name {
    font-size: 56px; font-weight: 400; letter-spacing: 0.1em;
    text-transform: uppercase; color: #F0ECE5; line-height: 1.2;
    font-family: 'Georgia', serif; margin-bottom: 36px;
  }
  .p3-tagline {
    font-size: 20px; color: rgba(240,236,229,0.45); line-height: 1.6;
    font-family: 'Georgia', serif; margin-bottom: 40px;
    max-width: 520px;
  }
  .p3-tagline em { color: #A89060; font-style: normal; opacity: 1; }
  .p3-rule { width: 40px; height: 1px; background: #A89060; opacity: 0.35; margin-bottom: 28px; }
  .p3-url {
    font-size: 11px; letter-spacing: 0.12em; color: rgba(240,236,229,0.22);
    font-family: 'Arial', sans-serif;
  }
</style>
</head>
